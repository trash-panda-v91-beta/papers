# Trending movies and TV from Seerr. Needs SEERR_API_KEY in the environment;
# each item gets trailer and add links, the add one requests the title in Seerr.
# feed = media publishes into media.xml instead of the default news.xml.
[[sources]]
name = "seerr-trending"
kind = "seerr"
url = "http://seerr.media.svc.cluster.local"
feed = "media"
weight = 7
max_per_fetch = 10
