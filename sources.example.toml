max_per_run = 8
# skip items older than this, so a source's archive never floods the feed (0 = no limit)
max_age_days = 7

[rank]
# hard keyword filters, applied before the model sees anything
exclude = ["giveaway", "sponsored", "webinar", "crypto"]
require_any = []
# 0 publishes everything; raise it as noise shows up
min_score = 0

[[sources]]
name = "lwn"
kind = "feed"
url = "https://lwn.net/headlines/rss"

[[sources]]
name = "hn"
kind = "feed"
url = "https://hnrss.org/frontpage"
max_per_fetch = 40

[[sources]]
name = "selfh-st"
kind = "feed"
url = "https://selfh.st/rss/"

[[sources]]
name = "example-html"
kind = "html"
url = "https://example.com/blog/"
item = "article"
title = "h2"
link = "a"
summary = "p"
max_per_fetch = 10

# Trending movies and TV from Seerr. Needs SEERR_API_KEY in the environment.
# Each item gets its poster, rating, an inline trailer and an add link that
# requests the title in Seerr. label prefixes the entry title in the feed.
[[sources]]
name = "seerr-trending"
kind = "seerr"
url = "http://seerr.media.svc.cluster.local"
label = "New in Seerr"
max_per_fetch = 10

# What recently landed in Jellyfin, newest first. Needs JELLYFIN_API_KEY.
# Each item gets its poster, rating, official rating, runtime, genres and an
# inline trailer when one is stored. A series names its newest episode on disk.
# libraries scopes the query; omit it to read the whole catalogue.
[[sources]]
name = "jellyfin-new"
kind = "jellyfin"
url = "http://jellyfin.media.svc.cluster.local:8096"
label = "New in Jellyfin"
libraries = ["Movies", "Shows"]
max_per_fetch = 10
