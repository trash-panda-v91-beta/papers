# Trending movies and TV from Seerr. Needs SEERR_API_KEY in the environment.
# Each item gets its poster, rating, an inline trailer and an add link that
# requests the title in Seerr. label prefixes the entry title in the feed.
[[sources]]
name = "seerr-trending"
kind = "seerr"
url = "http://seerr.media.svc.cluster.local"
label = "New in Seerr"
weight = 7
max_per_fetch = 10
