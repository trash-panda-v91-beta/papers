[tools]
actionlint = "1.7.12"
hk = "2.8.0"
pkl = "0.32.2"
rumdl = "0.3.0"
shellcheck = "0.11.0"
tombi = "1.8.9"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
rust = { version = "1.99.1", components = "rustfmt,clippy" }

[tasks.check]
description = "Run all checks"
run = "hk check --all"

[tasks.fix]
description = "Fix all issues"
run = "hk fix --all"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks."repo:sync"]
description = "Sync GitHub settings, labels and rulesets to the standard"
run = "bash scripts/repo-sync.sh"
