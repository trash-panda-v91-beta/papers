[package]
name = "papers"
version = "0.3.3"
edition = "2024"
rust-version = "1.85"
description = "Collect sources, keep what matters, print a daily paper as Atom"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "3"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "rustls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
