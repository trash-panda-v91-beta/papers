[package]
name = "papers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Collect sources, keep what matters, print a daily paper as Atom"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
